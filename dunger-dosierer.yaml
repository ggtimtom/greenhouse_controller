# ##################################################################################
# Scripte ##########################################################################
# ##################################################################################
script:
  # ==================================================================================
  # Dünger PWM aus den Grenzwerten 100%, 5% PWM und der eingestellten Dosiermenge
  # ==================================================================================
  - id: berechne_duenger_pwm
    then:
      - lambda: |-
          float ml_requested = id(duenger_ml).state; // Holt den aktuell eingestellten Wert
          float min_5 = id(menge_5_pwm).state;
          float min_100 = id(menge_100_pwm).state;
          float calculated_pwm = 0.0f;

          // 1. Absicherung gegen Division durch 0
          if (min_100 <= min_5) {
            ESP_LOGE("custom", "Fehler: max PWM ml muss größer als min PWM ml sein!");
            return;
          }

          // 2. Wenn 0 ml eingegeben werden, schaltet die Pumpe ab
          if (ml_requested <= 0.0f) {
            calculated_pwm = 0.0f;
          } 
          // 3. Unter dem 5% Limit -> Fahre mit 5%
          else if (ml_requested < min_5) {
            calculated_pwm = 5.0f;
            id(duenger_ml).publish_state(min_5); 
          } 
          // 4. Über dem 100% Limit -> Fahre mit 100%
          else if (ml_requested > min_100) {
            calculated_pwm = 100.0f;
            id(duenger_ml).publish_state(min_100); 
          } 
          // 5. Lineare Interpolation
          else {
            calculated_pwm = 5.0f + ((ml_requested - min_5) * (100.0f - 5.0f)) / (min_100 - min_5);
          }

          // 6. Werte überall live setzen (Nummernfeld, Hardware-PWM, Global & Sensor)
      
          aktuelle_pwm->value() = calculated_pwm; // Setzt die globale Variable
          id(actual_pump_pwm_sensor).publish_state(calculated_pwm);
          auto call = id(pumpe_fan).make_call();
          call.set_state(true);       // Schaltet den Lüfter ein
          call.set_speed(calculated_pwm);          // Setzt die Geschwindigkeit auf 5%
          call.perform();             // Führt die Aktion physisch aus

          ESP_LOGI("custom", "Berechnung erzwungen! Menge: %.0f ml -> Echte PWM: %.1f%%", ml_requested, calculated_pwm);

  # ==================================================================================
  # Wasserbedarf:
  #
  # Wenn ein Behälter Wassermangel hat Pumpe an
  # Wenn alle Behälter randvoll sind Pumpe aus
  # ==================================================================================
  - id: pruefe_wasser_bedarf
    mode: restart # Verhindert Kollisionen, falls Schalter gleichzeitig auslösen
    then:
      - lambda: |-
          // States holen (true = Schalter schwimmt/Signal da, false = trocken)
          bool leer_t1 = !id(t1_unten).state;
          bool leer_t2 = !id(t2_unten).state;
          bool leer_t3 = !id(t3_unten).state;
          bool leer_t4 = !id(t4_unten).state;
          bool leer_t5 = !id(t5_unten).state;
          bool leer_t6 = !id(t6_unten).state;

          bool voll_t1 = id(t1_oben).state;
          bool voll_t2 = id(t2_oben).state;
          bool voll_t3 = id(t3_oben).state;
          bool voll_t4 = id(t4_oben).state;
          bool voll_t5 = id(t5_oben).state;
          bool voll_t6 = id(t6_oben).state;

          // REGEL 1: Wenn IRGENDEIN Behälter leer ist, Ventil AN
          if (leer_t1 || leer_t2 || leer_t3 || leer_t4 || leer_t5 || leer_t6) {
            if (!id(relais_wasser).state) {
              ESP_LOGI("wasser", "Automatisches Befüllen gestartet: Ein Behälter ist leer!");
              //id(relais_wasser).turn_on();
            }
          }
          // REGEL 2: Wenn ALLE 6 Behälter randvoll sind, Ventil AUS
          else if (voll_t1 && voll_t2 && voll_t3 && voll_t4 && voll_t5 && voll_t6) {
            if (id(relais_wasser).state) {
              ESP_LOGI("wasser", "Befüllen beendet: Alle 6 Behälter sind voll.");
              //id(relais_wasser).turn_off();
            }
          }


  # ==================================================================================        
  # Unabhängiger Timer für die min-Pumpe (5% PWM)
  # ==================================================================================
  - id: timer_pumpe_min
    mode: restart # Setzt den Timer neu auf, falls der Schalter doppelt getrückt wird
    then:
      
      - switch.turn_off: duengerpumpe_max
      - switch.turn_on: relais_wasser
      - fan.turn_on:
          id: pumpe_fan
          speed: 5
      - lambda: |-
          id(aktuelle_pwm) = 5;
          id(actual_pump_pwm_sensor).publish_state(5);
      - component.update: actual_pump_pwm_sensor
      
      # Dynamische Wartezeit aus Ihrem Nummernfeld 'watertime_id' (in Sekunden)
      - delay: 60s
      
      # Nach Ablauf der Zeit: Alles automatisch ausschalten
      - switch.turn_off: duengerpumpe_min

  # ==================================================================================
  # Unabhängiger Timer für die max-Pumpe (100% PWM)
  # ==================================================================================
  - id: timer_pumpe_max
    mode: restart
    then:
      - switch.turn_off: duengerpumpe_min
      - switch.turn_on: relais_wasser
      - fan.turn_on:
          id: pumpe_fan
          speed: 100
      - lambda: |-
          id(aktuelle_pwm) = 100;
          id(actual_pump_pwm_sensor).publish_state(100);
      - component.update: actual_pump_pwm_sensor
      
      # Dynamische Wartezeit aus Ihrem Nummernfeld 'watertime_id'
      - delay: 60s
      
      # Nach Ablauf der Zeit: Alles automatisch ausschalten
      - switch.turn_off: duengerpumpe_max


  # ==================================================================================       
  # Unabhängiger Timer für das automatische Abschalten beim Zapfen
  # ==================================================================================
  - id: timer_wasser_duenger_zapfen
    mode: restart
    then:
      - switch.turn_on: relais_wasser       # Wasserventil öffnen
      - script.execute: berechne_duenger_pwm # Düngerberechnung & Pumpe starten
      
      # Dynamische Wartezeit aus Ihrem Nummernfeld 'watertime_id'
      - delay: !lambda "return id(watertime_fertilizer_id).state * 1000;"
      
      # Nach Ablauf der Zeit: Schaltet den GPIO-Schalter aus (triggert dort das on_turn_off)
      - switch.turn_off: relais_wasser
      - script.execute: dosiermotor_aus
        
  # ==================================================================================
  # Unabhängiger Timer für das automatische Abschalten beim Zapfen
  # ==================================================================================
  - id: timer_wasser_zapfen
    mode: restart
    then:

      # Dynamische Wartezeit aus Ihrem Nummernfeld 'watertime_id'
      - delay: !lambda "return id(watertime_id).state * 1000;"
      
      # Nach Ablauf der Zeit: Schaltet den GPIO-Schalter aus (triggert dort das on_turn_off)
      - switch.turn_off: relais_wasser
        
  - id: dosiermotor_aus
    mode: restart
    then:
      - fan.turn_off:
            id: pumpe_fan
      - lambda: |-
            id(aktuelle_pwm) = 0;
            id(actual_pump_pwm_sensor).publish_state((int)0);
      - component.update: actual_pump_pwm_sensor
